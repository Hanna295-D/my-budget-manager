<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BudgetBuddy</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#2b2d33;--mut:#7b7f89;--line:#ebe9e4;--mint:#d5ece1;--rose:#f6d9da;--lav:#e0dbf3;--peach:#fbe6d3;--inc:#3f8f6b;--exp:#c2646c}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh;width:100%}
nav{width:clamp(200px,14vw,260px);background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:700;font-size:17px;margin:0 8px 22px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:12px;color:var(--mut);margin-bottom:4px}
nav button.on{background:var(--lav);color:var(--ink);font-weight:600}
main{flex:1 1 0;width:100%;max-width:none;min-width:0;padding:clamp(16px,2.2vw,40px)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 12px}
.mon{display:flex;gap:6px}.mon input{width:auto}
button,input,select,textarea{font:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;color:var(--ink)}
button:hover{background:#faf9f7}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{border-radius:16px;padding:16px}.stat small{color:var(--mut);display:block}
.stat b{font-size:19px;display:block;margin-top:4px;word-break:break-word}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.prog{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--inc)}
.prog.warn i{background:#e5b46a}.prog.over i{background:var(--exp)}
.row{display:grid;grid-template-columns:88px 1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.m small{display:block;color:var(--mut)}
.chip,.tag{background:var(--lav);border-radius:20px;padding:2px 10px;font-size:12px}
.tag{background:var(--peach)}
.a{font-weight:600;text-align:right}
.act{display:flex;gap:6px}.act button{padding:4px 9px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bar input{flex:2 1 160px;width:auto}.bar select{flex:1 1 130px;width:auto}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.banner{background:var(--peach);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{color:var(--mut);font-size:12.5px;margin-top:24px}
.cb{display:grid;grid-template-columns:110px 1fr 100px;gap:10px;align-items:center;margin:8px 0}
.cb .prog i{background:#b9aee6}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}
label input,label select,label textarea{margin-top:4px;color:var(--ink);font-size:15px}
dialog{border:0;border-radius:18px;padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(40,40,50,.35)}
.end{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(12px,1.3vw,22px);align-items:start}
#main>*{min-width:0;margin:0}
#main>.grid,#main>.bar,#main>.banner,#main>#list,#main>.card.wide{grid-column:1/-1}
#main .grid{margin:0}
.stat b{font-size:clamp(19px,1.6vw,28px)}
.card svg{display:block;max-height:380px;margin:0 auto}
#cf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px}
#cf>p,#cf>button{grid-column:1/-1}#cf>button{justify-self:start}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
.app{flex-direction:column}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;display:flex;padding:6px;z-index:5;border-right:0;border-top:1px solid var(--line)}
.logo{display:none}
nav button{text-align:center;padding:9px 2px;font-size:12px;margin:0}
main{padding:16px 14px 90px}
.grid{grid-template-columns:1fr 1fr}
.row{display:flex;flex-wrap:wrap;gap:6px 10px}.m{flex:1 1 100%;order:-1}.a{margin-left:auto}
.cb{grid-template-columns:90px 1fr 84px}
}
.banner.over{background:var(--rose)}
.cl{margin-bottom:12px}.cl small{color:var(--mut)}
.gh{display:flex;justify-content:space-between;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.danger{border-color:#e9b9bd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #8b7fd0;outline-offset:2px}
@media(max-width:760px){nav button{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<nav>
<div class="logo">💰 BudgetBuddy</div>
<button data-v="dashboard">📊 Dashboard</button>
<button data-v="transactions">🧾 Transactions</button>
<button data-v="budget">🎯 Budget</button>
<button data-v="savings">🐷 Savings</button>
<button data-v="reports">📈 Reports</button>
<button data-v="backup">💾 Backup</button>
</nav>
<main>
<header><h1 id="ttl"></h1><div class="mon"><button id="pm" aria-label="Previous month">‹</button><input type="month" id="mon"><button id="nm" aria-label="Next month">›</button></div></header>
<div id="demo"></div>
<div id="main"></div>
<p class="note">ℹ️ Your data is saved only in this browser's localStorage. It is not secure cloud storage and does not sync between devices. Clearing browser data or using another browser/device means starting empty, so download a JSON backup regularly (Backup page).</p>
</main>
</div>
<dialog id="dlg"><form id="f" novalidate>
<h2 id="ft2">Add transaction</h2>
<label>Type<select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></label>
<label>Description<input name="desc" maxlength="80"></label>
<label>Amount (RM)<input name="amt" type="number" step="0.01" min="0" inputmode="decimal"></label>
<label>Date<input name="date" type="date"></label>
<label>Category<select name="cat"></select></label>
<label>Notes (optional)<textarea name="notes" rows="2" maxlength="300"></textarea></label>
<p id="err" class="exp"></p>
<div class="end"><button type="button" id="cancel">Cancel</button><button class="pri">Save</button></div>
</form></dialog>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),KEY='mbm_v1',DLG=$('#dlg'),F=$('#f');
const DEF={income:['Salary','Freelance','Others'],expense:['Food','Groceries','Transport','Shopping','Bills','Healthcare','Entertainment','Others']};
const fresh=()=>({v:2,tx:[],budgets:{},catBudgets:{},goals:[],cats:{income:[...DEF.income],expense:[...DEF.expense]}});
let loadErr=false;
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),ym=d=>ymd(d).slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=c=>(c<0?'-':'')+'RM '+(Math.abs(c)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cmp=(a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id);
function clean(d){const bad=e=>({ok:false,e}),isI=(v,min=0)=>Number.isInteger(v)&&v>=min&&v<=1e11;
 if(!d||typeof d!='object'||Array.isArray(d))return bad('The file is not a BudgetBuddy backup.');
 const g=(a,b)=>d[a]!==undefined?d[a]:d[b],tx=g('transactions','tx')||[],bu=g('budgets','budgets')||{},cb=g('catBudgets','catBudgets')||{},go=g('savingsGoals','goals')||[],ct=g('categories','cats')||DEF;
 if(!Array.isArray(tx)||!Array.isArray(go)||typeof bu!='object'||typeof cb!='object'||!ct||!Array.isArray(ct.income)||!Array.isArray(ct.expense))return bad('The data structure is invalid.');
 const ids=new Set(),cats={income:[],expense:[]},T=[];
 for(const k of['income','expense']){for(const c of ct[k]){if(typeof c!='string'||!c.trim()||c.length>40)return bad('A category name is invalid.');if(!cats[k].includes(c.trim()))cats[k].push(c.trim())}if(!cats[k].length)return bad('There are no '+k+' categories.')}
 for(let i=0;i<tx.length;i++){const t=tx[i],n='Transaction #'+(i+1);
  if(!t||typeof t!='object')return bad(n+' is invalid.');
  if(typeof t.desc!='string'||!t.desc.trim()||t.desc.length>200)return bad(n+' has no valid description.');
  if(!isI(t.amt,1))return bad(n+' has an invalid amount.');
  if(typeof t.date!='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||isNaN(Date.parse(t.date)))return bad(n+' has an invalid date.');
  if(t.type!='income'&&t.type!='expense')return bad(n+' has an invalid type.');
  if(typeof t.cat!='string'||!t.cat.trim())return bad(n+' has no category.');
  const id=typeof t.id=='string'&&t.id?t.id:uid();if(ids.has(id))return bad(n+' has a duplicate ID.');ids.add(id);
  if(!cats[t.type].includes(t.cat))cats[t.type].push(t.cat);
  T.push({id,desc:t.desc.trim(),amt:t.amt,date:t.date,type:t.type,cat:t.cat,notes:typeof t.notes=='string'?t.notes:'',...(t.demo?{demo:true}:{})})}
 const B={},C={},G=[];
 for(const[k,v]of Object.entries(bu)){if(!/^\d{4}-\d{2}$/.test(k)||!isI(v))return bad('A monthly budget entry is invalid.');B[k]=v}
 for(const[k,v]of Object.entries(cb)){if(!isI(v))return bad('A category limit is invalid.');C[k]=v}
 for(const x of go){if(!x||typeof x.name!='string'||!x.name.trim()||!isI(x.target,1)||!isI(x.saved))return bad('A savings goal is invalid.');G.push({id:typeof x.id=='string'&&x.id?x.id:uid(),name:x.name.trim().slice(0,60),target:x.target,saved:x.saved})}
 return{ok:true,v:{v:2,tx:T,budgets:B,catBudgets:C,goals:G,cats}}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return fresh();try{const r=clean(JSON.parse(raw));if(r.ok)return r.v}catch(e){}try{localStorage.setItem(KEY+'_corrupt',raw)}catch(e){}}catch(e){}loadErr=true;return fresh()}
let S=load(),view='dashboard',month=ym(new Date()),editId=null,q='',fc='',ft='',fy=month.slice(0,4),fmo=month.slice(5);
const syncF=()=>{fy=month.slice(0,4);fmo=month.slice(5)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Could not save: browser storage is unavailable or full.');return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
const monthTx=m=>S.tx.filter(t=>t.date.startsWith(m));
const sums=l=>l.reduce((s,t)=>(s[t.type=='income'?'inc':'exp']+=t.amt,s),{inc:0,exp:0});
function budgetFor(m){const k=Object.keys(S.budgets).filter(x=>x<=m).sort();return k.length?S.budgets[k.pop()]:0}
const row=t=>`<div class="row"><div>${t.date}</div><div class="m"><b>${esc(t.desc)}</b>${t.demo?' <span class="tag">demo</span>':''}<small>${esc(t.notes||'')}</small></div><span class="chip">${esc(t.cat)}</span><div class="a ${t.type=='income'?'inc':'exp'}">${t.type=='income'?'+':'−'}${fmt(t.amt)}</div><div class="act"><button data-e="${t.id}">Edit</button><button data-x="${t.id}">Delete</button></div></div>`;
function prog(){const b=budgetFor(month),e=sums(monthTx(month)).exp;
 if(!b)return'<p class="empty">No budget set yet. <button data-v="budget">Set a budget</button></p>';
 const p=e/b*100,left=b-e;
 return`<div class="prog ${p>100?'over':p>=80?'warn':''}"><i style="width:${Math.min(100,p)}%"></i></div><p>${fmt(e)} of ${fmt(b)} spent (${p.toFixed(0)}%) · ${left>=0?fmt(left)+' left':'<b class="exp">'+fmt(-left)+' over budget</b>'}</p>`}
function dash(){const l=monthTx(month),s=sums(l),b=budgetFor(month),rec=[...l].sort(cmp).slice(0,5);
 return`<div class="grid"><div class="stat" style="background:var(--mint)"><small>Total income</small><b>${fmt(s.inc)}</b></div><div class="stat" style="background:var(--rose)"><small>Total expenses</small><b>${fmt(s.exp)}</b></div><div class="stat" style="background:var(--lav)"><small>Remaining balance</small><b>${fmt(s.inc-s.exp)}</b></div><div class="stat" style="background:var(--peach)"><small>Monthly budget</small><b>${b?fmt(b):'Not set'}</b></div></div>${alerts()}
<div class="card"><h2>Budget progress</h2>${prog()}</div>
<div class="card"><h2>Spending overview</h2>${catBars(l)}</div>
<div class="card wide"><h2>Recent transactions</h2>${rec.length?rec.map(row).join(''):'<p class="empty">No transactions this month yet.</p>'}<p><button class="pri" id="add">+ Add transaction</button></p></div>`}
const byCat=l=>{const by={};l.filter(t=>t.type=='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);return Object.entries(by).sort((a,b)=>b[1]-a[1])};
const catBars=l=>{const e=byCat(l),tot=e.reduce((a,x)=>a+x[1],0);return e.length?e.map(([c,v])=>`<div class="cb"><span>${esc(c)}</span><div class="prog"><i style="width:${v/tot*100}%"></i></div><span style="text-align:right">${fmt(v)}</span></div>`).join(''):'<p class="empty">No expenses recorded for this period.</p>'};
function alerts(){const l=monthTx(month),by=Object.fromEntries(byCat(l)),a=[];
 const chk=(n,v,lim)=>{if(!lim)return;const p=v/lim*100;if(p>100)a.push(`<div class="banner over">⚠️ ${esc(n)}: over budget by ${fmt(v-lim)}</div>`);else if(p>=80)a.push(`<div class="banner">⚡ ${esc(n)}: ${p.toFixed(0)}% of ${fmt(lim)} used</div>`)};
 chk('Monthly budget',sums(l).exp,budgetFor(month));Object.entries(S.catBudgets).forEach(([c,v])=>chk(c,by[c]||0,v));return a.join('')}
const allCats=()=>[...new Set([...S.cats.income,...S.cats.expense])];
function txView(){const yrs=[...new Set([...S.tx.map(t=>t.date.slice(0,4)),month.slice(0,4),fy].filter(Boolean))].sort().reverse(),o=a=>a.map(c=>`<option>${esc(c)}</option>`).join('');
 return`<div class="bar"><input id="q" type="search" aria-label="Search transactions" placeholder="Search description or notes…" value="${esc(q)}"><select id="fy" aria-label="Year"><option value="">All years</option>${o(yrs)}</select><select id="fmo" aria-label="Month"><option value="">All months</option>${[...Array(12)].map((_,i)=>`<option value="${pad(i+1)}">${new Date(2000,i,1).toLocaleString('en-GB',{month:'long'})}</option>`).join('')}</select><select id="fc" aria-label="Category"><option value="">All categories</option>${o(allCats())}</select><select id="ft" aria-label="Type"><option value="">Income &amp; expenses</option><option value="income">Income only</option><option value="expense">Expenses only</option></select><button class="pri" id="add">+ Add</button><button id="csv">Export CSV</button></div><div class="card" id="list"></div>`}
function renderList(){$('#fy').value=fy;$('#fmo').value=fmo;$('#fc').value=fc;$('#ft').value=ft;
 const n=q.trim().toLowerCase(),all=S.tx.filter(t=>(!fy||t.date.startsWith(fy))&&(!fmo||t.date.slice(5,7)==fmo)),l=all.filter(t=>(!fc||t.cat==fc)&&(!ft||t.type==ft)&&(!n||(t.desc+' '+(t.notes||'')).toLowerCase().includes(n))).sort(cmp),s=sums(l);
 $('#list').innerHTML=l.length?`<p style="color:var(--mut);margin-top:0">${l.length} transaction${l.length>1?'s':''} · Income ${fmt(s.inc)} · Expenses ${fmt(s.exp)}</p>`+l.map(row).join(''):`<p class="empty">${all.length?'No transactions match your search or filters.':'No transactions for this period yet. Click “+ Add” to create one.'}</p>`}
function budView(){const b=budgetFor(month),own=S.budgets[month]!=null,by=Object.fromEntries(byCat(monthTx(month)));
 return`<div class="card"><h2>Monthly budget for ${month}</h2><form id="bf" novalidate><label>Budget amount (RM)<input name="b" type="number" step="0.01" min="0" inputmode="decimal" value="${b?(b/100).toFixed(2):''}"></label><p id="berr" class="exp"></p><button class="pri">Save budget</button> ${own?'<button type="button" id="bRm">Remove this month’s budget</button>':''}</form><p class="note">A budget applies to the selected month and carries forward to later months until you set a new one.</p></div>
<div class="card"><h2>Spending progress</h2>${prog()}${alerts()}</div>
<div class="card wide"><h2>Category spending limits</h2><p class="note" style="margin-top:0">Monthly limit per expense category (applies to every month). Leave blank for no limit.</p><form id="cf" novalidate>${S.cats.expense.map(c=>{const lim=S.catBudgets[c]||0,v=by[c]||0,p=lim?v/lim*100:0;return`<div class="cl"><label>${esc(c)} (RM)<input data-c="${esc(c)}" type="number" step="0.01" min="0" inputmode="decimal" value="${lim?(lim/100).toFixed(2):''}" placeholder="No limit"></label>${lim?`<div class="prog ${p>100?'over':p>=80?'warn':''}"><i style="width:${Math.min(100,p)}%"></i></div><small>${fmt(v)} of ${fmt(lim)} (${p.toFixed(0)}%)${p>100?' · over limit':p>=80?' · approaching limit':''}</small>`:''}</div>`}).join('')}<p id="cerr" class="exp"></p><button class="pri">Save category limits</button></form></div>
<div class="card"><h2>Categories</h2><p><b>Income:</b> ${S.cats.income.map(esc).join(', ')}<br><b>Expense:</b> ${S.cats.expense.map(esc).join(', ')}</p><form id="af" class="bar" novalidate><select name="t" aria-label="Category type"><option value="expense">Expense</option><option value="income">Income</option></select><input name="n" maxlength="40" aria-label="New category name" placeholder="New category name"><button class="pri">Add category</button></form><p id="aerr" class="exp"></p></div>`}
const goalCard=g=>{const p=g.saved/g.target*100;return`<div class="card"><div class="gh"><b>${esc(g.name)}</b><span>${p.toFixed(0)}%</span></div><div class="prog"><i style="width:${Math.min(100,p)}%"></i></div><p>${fmt(g.saved)} of ${fmt(g.target)}${p>=100?' 🎉 Goal reached!':' · '+fmt(g.target-g.saved)+' to go'}</p><div class="act"><button data-ga="${g.id}">+ Add money</button><button data-gw="${g.id}">Withdraw</button><button data-ge="${g.id}">Edit</button><button data-gx="${g.id}">Delete</button></div></div>`};
function savView(){return`<div class="card wide"><h2>New savings goal</h2><form id="gf" class="bar" novalidate><input name="n" maxlength="60" aria-label="Goal name" placeholder="Goal name (e.g. Emergency fund)"><input name="t" type="number" step="0.01" min="0" aria-label="Target amount (RM)" placeholder="Target (RM)"><input name="s" type="number" step="0.01" min="0" aria-label="Saved so far (RM)" placeholder="Saved so far (RM)"><button class="pri">Add goal</button></form><p id="gerr" class="exp"></p></div>`+(S.goals.length?S.goals.map(goalCard).join(''):'<div class="card wide"><p class="empty">No savings goals yet. Create one above to start tracking your progress.</p></div>')}
function chart(ms){const mx=Math.max(1,...ms.flatMap(x=>[x.inc,x.exp])),H=180,T=15,g=600/ms.length,w=g*.3;
 if(!ms.some(x=>x.inc||x.exp))return'<p class="empty">No income or expenses recorded for this period.</p>';
 const bars=ms.map((x,i)=>{const o=i*g,r=(p,v,c,t)=>{const h=v/mx*H;return`<rect x="${o+g*p}" y="${T+H-h}" width="${w}" height="${h}" rx="3" fill="${c}"><title>${t} ${x.l}: ${fmt(v)}</title></rect>`};return r(.17,x.inc,'#9fd5bb','Income')+r(.53,x.exp,'#eeb0b4','Expenses')+`<text x="${o+g/2}" y="${T+H+20}" text-anchor="middle" font-size="12" fill="#7b7f89">${x.l}</text>`}).join('');
 return`<svg viewBox="0 0 600 215" width="100%" role="img" aria-label="Income versus expenses chart"><line x1="0" x2="600" y1="${T+H}" y2="${T+H}" stroke="#ebe9e4"/>${bars}</svg><p><span style="color:#5aae86">■</span> Income &nbsp; <span style="color:#d98b91">■</span> Expenses &nbsp; <small style="color:var(--mut)">Hover or tap a bar for the exact amount. Tallest bar = ${fmt(mx)}.</small></p>`}
const mser=(y,m0,n,yy)=>[...Array(n)].map((_,i)=>{const d=new Date(y,m0+i,1);return{l:d.toLocaleString('en-GB',{month:'short'})+(yy?' '+String(d.getFullYear()).slice(2):''),...sums(monthTx(ym(d)))}});
const stats=s=>`<div class="grid"><div class="stat" style="background:var(--mint)"><small>Income</small><b>${fmt(s.inc)}</b></div><div class="stat" style="background:var(--rose)"><small>Expenses</small><b>${fmt(s.exp)}</b></div><div class="stat" style="background:var(--lav)"><small>Net</small><b>${fmt(s.inc-s.exp)}</b></div><div class="stat" style="background:var(--peach)"><small>Savings rate</small><b>${s.inc>0?((s.inc-s.exp)/s.inc*100).toFixed(0)+'%':'–'}</b></div></div>`;
function repView(){const[y,m]=month.split('-').map(Number),l=monthTx(month),yl=S.tx.filter(t=>t.date.startsWith(y+'-')),ys=sums(yl),m12=mser(y,0,12);
 return`<div class="card wide"><h2>Monthly report: ${month}</h2>${stats(sums(l))}<h2>Income vs expenses (last 6 months)</h2>${chart(mser(y,m-6,6,1))}</div>
<div class="card"><h2>Expenses by category (${month})</h2>${catBars(l)}</div>
<div class="card wide"><h2>Yearly summary: ${y}</h2>${stats(ys)}${chart(m12)}<div style="overflow-x:auto"><table><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th></tr>${m12.map(x=>`<tr><td>${x.l}</td><td>${fmt(x.inc)}</td><td>${fmt(x.exp)}</td><td class="${x.inc>=x.exp?'inc':'exp'}">${fmt(x.inc-x.exp)}</td></tr>`).join('')}<tr><th>Total</th><th>${fmt(ys.inc)}</th><th>${fmt(ys.exp)}</th><th>${fmt(ys.inc-ys.exp)}</th></tr></table></div></div>
<div class="card"><h2>Expenses by category (${y})</h2>${catBars(yl)}</div>`}
function bakView(){const demo=S.tx.some(t=>t.demo);
 return`<div class="card"><h2>Download backup</h2><p>Saves <b>all</b> your data (transactions, budgets, category limits, categories and savings goals) to a .json file. Currently stored: ${S.tx.length} transactions, ${S.goals.length} savings goals.</p><button class="pri" id="jsonEx">Download JSON backup</button> <button id="csv">Export transactions (CSV)</button></div>
<div class="card"><h2>Restore from backup</h2><p>Choose a BudgetBuddy .json backup. The file is checked first and nothing changes until you confirm. Restoring <b>replaces</b> all current data (one safety copy of it is kept in this browser).</p><input type="file" id="jsonIm" accept=".json,application/json" aria-label="Choose backup file"><div id="bmsg" role="status" aria-live="polite" style="margin-top:12px"></div></div>
<div class="card"><h2>Demo data</h2><p><button id="demoLoad">Load demo data</button> ${demo?'<button id="demoRm">Remove demo data</button>':''}</p><p class="note">Demo transactions are labelled “demo” and are not real records.</p></div>
<div class="card danger"><h2>Clear all data</h2><p>Permanently deletes everything stored by BudgetBuddy in this browser. Download a backup first.</p><button id="wipe" class="exp">Delete all data…</button></div>`}
function exportJson(){const o={app:'BudgetBuddy',backupVersion:2,exportedAt:new Date().toISOString(),data:{transactions:S.tx,budgets:S.budgets,catBudgets:S.catBudgets,categories:S.cats,savingsGoals:S.goals}};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='budgetbuddy-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup downloaded')}
async function importJson(file){if(!file)return;const say=(t,ok)=>{const m=$('#bmsg');if(m){m.className='banner'+(ok?'':' over');m.textContent=t}};
 if(file.size>5e6)return say('❌ File is too large to be a backup. Nothing was changed.');
 const txt=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsText(file)});let d;
 try{d=JSON.parse(txt)}catch(e){return say('❌ This file is not valid JSON. Nothing was changed.')}
 if(!d||d.app!=='BudgetBuddy'||!d.data||!Number.isInteger(d.backupVersion))return say('❌ This is not a BudgetBuddy backup file. Nothing was changed.');
 if(d.backupVersion>2)return say('❌ This backup was made by a newer version of BudgetBuddy. Nothing was changed.');
 const r=clean(d.data);if(!r.ok)return say('❌ '+r.e+' Nothing was changed.');const n=r.v;
 if(!confirm(`Restore backup from ${String(d.exportedAt||'unknown date').slice(0,25)}?\n\nThis REPLACES your current data (${S.tx.length} transactions, ${S.goals.length} goals) with the backup (${n.tx.length} transactions, ${n.goals.length} goals).\n\nContinue?`))return say('Restore cancelled. Nothing was changed.',1);
 const old=S,prev=JSON.stringify(S);S=n;
 if(!save()){S=old;return say('❌ Could not save the restored data. Nothing was changed.')}
 try{localStorage.setItem(KEY+'_prev',prev)}catch(e){}
 render();say(`✅ Backup restored: ${n.tx.length} transactions, ${n.goals.length} savings goals.`,1);toast('Backup restored')}
function wipe(){if(!confirm('⚠️ This permanently deletes ALL transactions, budgets, category limits, categories and savings goals from this browser.\n\nDownload a JSON backup first if you might need your data.\n\nContinue?'))return;
 if((prompt('Final check: type DELETE (capital letters) to erase everything.')||'').trim()!=='DELETE')return toast('Nothing was deleted.');
 S=fresh();try{localStorage.removeItem(KEY+'_prev');localStorage.removeItem(KEY+'_corrupt')}catch(e){}save();render();toast('All data deleted')}
const askAmt=(m,def)=>{const x=prompt(m,def!=null?(def/100).toFixed(2):'');if(x==null)return null;const v=Math.round(parseFloat(x)*100);if(!isFinite(v)||v<=0||v>1e11){toast('Enter a valid amount.');return null}return v};
function addGoal(f){const e=f.elements,n=e.n.value.trim(),t=Math.round(parseFloat(e.t.value)*100),v=e.s.value===''?0:Math.round(parseFloat(e.s.value)*100),er=m=>{$('#gerr').textContent=m};
 if(!n)return er('Enter a goal name.');if(!isFinite(t)||t<=0||t>1e11)return er('Enter a target amount above RM 0.00.');if(!isFinite(v)||v<0||v>1e11)return er('Saved amount must be 0 or more.');
 S.goals.push({id:uid(),name:n.slice(0,60),target:t,saved:v});save();render();toast('Goal added')}
function goalOp(k,id){const g=S.goals.find(x=>x.id==id);if(!g)return;
 if(k=='x'){if(!confirm('Delete savings goal “'+g.name+'”?'))return;S.goals=S.goals.filter(x=>x!=g)}
 else if(k=='e'){const n=prompt('Goal name:',g.name);if(n==null)return;const t=askAmt('Target amount (RM):',g.target);if(!n.trim()||t==null)return toast('Name and target are required.');g.name=n.trim().slice(0,60);g.target=t}
 else{const v=askAmt(k=='a'?'Amount to add (RM):':'Amount to withdraw (RM):');if(v==null)return;if(k=='w'&&v>g.saved)return toast('You cannot withdraw more than is saved.');g.saved+=k=='a'?v:-v}
 save();render()}
function saveCatLimits(){const nb={};for(const i of document.querySelectorAll('[data-c]')){if(i.value==='')continue;const v=Math.round(parseFloat(i.value)*100);if(!isFinite(v)||v<0||v>1e11)return $('#cerr').textContent='“'+i.dataset.c+'” has an invalid amount.';if(v)nb[i.dataset.c]=v}
 S.catBudgets=nb;save();render();toast('Category limits saved')}
function addCat(f){const t=f.elements.t.value,n=f.elements.n.value.trim(),er=m=>{$('#aerr').textContent=m};
 if(!n||n.length>40)return er('Enter a category name (up to 40 characters).');if(S.cats[t].some(c=>c.toLowerCase()==n.toLowerCase()))return er('That category already exists.');
 S.cats[t].push(n);save();render();toast('Category added')}
const V={dashboard:'Dashboard',transactions:'Transactions',budget:'Budget',savings:'Savings Goals',reports:'Reports',backup:'Backup & Restore'};
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
 $('#ttl').textContent=V[view];$('#mon').value=month;
 $('#demo').innerHTML=S.tx.some(t=>t.demo)?'<div class="banner">Demo data is present. These are NOT real records. <button id="demoRm">Remove demo data</button></div>':'';
 $('#main').innerHTML=({dashboard:dash,transactions:txView,budget:budView,savings:savView,reports:repView,backup:bakView})[view]();
 if(view=='transactions')renderList();
}
function fillCats(sel){const e=F.elements,l=S.cats[e.type.value];e.cat.innerHTML=l.map(c=>`<option>${c}</option>`).join('');if(sel&&l.includes(sel))e.cat.value=sel}
function openForm(id){editId=id||null;const t=id?S.tx.find(x=>x.id==id):null,e=F.elements;
 $('#ft2').textContent=t?'Edit transaction':'Add transaction';
 e.type.value=t?t.type:'expense';fillCats(t&&t.cat);e.desc.value=t?t.desc:'';e.amt.value=t?(t.amt/100).toFixed(2):'';
 e.date.value=t?t.date:(month==ym(new Date())?ymd(new Date()):month+'-01');e.notes.value=t?t.notes||'':'';
 $('#err').textContent='';DLG.showModal()}
function saveTx(){const e=F.elements,desc=e.desc.value.trim(),a=Math.round(parseFloat(e.amt.value)*100),date=e.date.value,er=m=>{$('#err').textContent=m};
 if(!desc)return er('Please enter a description.');
 if(!isFinite(a)||a<=0)return er('Enter an amount greater than RM 0.00.');
 if(a>1e11)return er('Amount is too large.');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(Date.parse(date)))return er('Please choose a valid date.');
 const o={desc,amt:a,date,type:e.type.value,cat:e.cat.value,notes:e.notes.value.trim()};
 if(editId){const t=S.tx.find(x=>x.id==editId);Object.assign(t,o);delete t.demo}else S.tx.push({id:uid(),...o});
 save();month=date.slice(0,7);syncF();DLG.close();render();toast(editId?'Transaction updated':'Transaction added')}
function del(id){const t=S.tx.find(x=>x.id==id);if(t&&confirm('Delete “'+t.desc+'” ('+fmt(t.amt)+')?')){S.tx=S.tx.filter(x=>x.id!=id);save();render();toast('Deleted')}}
function demo(){const b=new Date();
 const mk=(off,day,desc,amt,type,cat)=>({id:uid(),desc,amt,date:ymd(new Date(b.getFullYear(),b.getMonth()-off,day)),type,cat,notes:'Demo data',demo:true});
 for(let o=0;o<3;o++)S.tx.push(mk(o,1,'Monthly salary',450000,'income','Salary'),mk(o,3,'Groceries run',28050,'expense','Groceries'),mk(o,8,'Lunch & coffee',4550+o*900,'expense','Food'),mk(o,12,'Electricity & internet',35000,'expense','Bills'),mk(o,15,'Touch n Go top-up',12000,'expense','Transport'),mk(o,20,'Movie night',6000,'expense','Entertainment'));
 S.tx.push(mk(1,10,'Freelance project',80000,'income','Freelance'));save();render();toast('Demo data loaded')}
function exportCsv(){if(!S.tx.length)return toast('Nothing to export yet');
 const q=v=>{v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
 const rows=[['Date','Type','Category','Description','Amount (RM)','Notes','Demo']].concat([...S.tx].sort(cmp).reverse().map(t=>[t.date,t.type,t.cat,t.desc,(t.amt/100).toFixed(2),t.notes||'',t.demo?'yes':'']));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
 a.download='budgetbuddy-transactions-'+ymd(new Date())+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('CSV exported (all months)')}
const shift=n=>{const[y,m]=month.split('-').map(Number);month=ym(new Date(y,m-1+n,1));syncF();render()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.v){view=d.v;render()}else if(d.e)openForm(d.e);else if(d.x)del(d.x);
 else if(b.id=='add')openForm();else if(b.id=='cancel')DLG.close();else if(b.id=='csv')exportCsv();
 else if(b.id=='pm')shift(-1);else if(b.id=='nm')shift(1);else if(b.id=='demoLoad')demo();
 else if(b.id=='demoRm'){S.tx=S.tx.filter(t=>!t.demo);save();render();toast('Demo data removed')}
 else if(b.id=='bRm'){delete S.budgets[month];save();render()}
 else if(b.id=='wipe')wipe();else if(b.id=='jsonEx')exportJson();else if(d.ga)goalOp('a',d.ga);else if(d.gw)goalOp('w',d.gw);else if(d.ge)goalOp('e',d.ge);else if(d.gx)goalOp('x',d.gx)});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id=='f')saveTx();else if(e.target.id=='cf')saveCatLimits();else if(e.target.id=='gf')addGoal(e.target);else if(e.target.id=='af')addCat(e.target);
 else if(e.target.id=='bf'){const v=Math.round(parseFloat(e.target.elements.b.value)*100);
  if(!isFinite(v)||v<0||v>1e11)return $('#berr').textContent='Enter a valid amount (0 or more).';
  if(v)S.budgets[month]=v;else delete S.budgets[month];save();render();toast('Budget saved')}});
document.addEventListener('input',e=>{const i=e.target.id;
 if(['q','fc','ft','fy','fmo'].includes(i)){const v=e.target.value;if(i=='q')q=v;else if(i=='fc')fc=v;else if(i=='ft')ft=v;else if(i=='fy')fy=v;else fmo=v;renderList()}});
document.addEventListener('change',e=>{
 if(e.target.name=='type'&&e.target.form==F)fillCats();
 if(e.target.id=='jsonIm'){importJson(e.target.files[0]);e.target.value=''}
 if(e.target.id=='mon'&&e.target.value){month=e.target.value;syncF();render()}});
render();if(loadErr)toast('Saved data was unreadable. A copy was kept and the app started empty.');
</script>
</body>
</html>
